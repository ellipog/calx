# Builds the website (site/) on every push and pull request that changes something it's made from:
# the site itself, the docs it renders, the README its numbers come from, the art in assets/logo
# and the grammar that highlights its code. A change that breaks the site fails here, not on deploy.
#
# Deploying to GitHub Pages waits for two settings: Pages set to deploy from GitHub Actions, with
# calxlang.com as its custom domain, and the repository variable SITE_DEPLOY set to "true". Until
# then main's site is built and checked but not published.
name: site

on:
  push:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'assets/logo/**'
      - 'tools/vscode/syntaxes/**'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'assets/logo/**'
      - 'tools/vscode/syntaxes/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push replaces a build still running, but never a deploy halfway through.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci
      # Astro, then Pagefind's search index. The pages go to build/site.
      - name: Build
        working-directory: site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_DEPLOY == 'true'
        with:
          path: build/site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
