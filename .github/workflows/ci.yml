# Builds the compiler and runs the test suite, including every example in the reference docs
# (D41), in debug and release builds on Windows and Linux, on x64 and on Arm. A push that only
# changes the website (site/) skips it; a change to docs/ still runs it, since the docs' examples
# are tests. A push runs it only on main and on v* tags, which the package and publish jobs need: a
# pull request's branch is tested by the pull_request event alone, so each push to it runs it once,
# not twice (CLX-392). A pull request that changes only the website, the docs' top-level pages,
# README.md, LICENSE or the bench workflow skips the tests, and `ci`, the check to require, passes.
name: ci

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      # A nightly's own release, which publish makes.
      - '!v*-nightly.*'
    paths-ignore:
      - 'site/**'
  pull_request:

# A pull request's new push cancels the run of the one before. A run of main or a tag is never
# cancelled, since each publishes what it built.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          COUNT: ${{ github.event.pull_request.changed_files }}
        run: |
          code=true
          # GitHub lists at most 3000 of a pull request's files, so a bigger one runs everything.
          if [ "$COUNT" -le 3000 ] && files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename'); then
            echo "$files"
            if [ -n "$files" ] && ! grep -qvE '^(site/.*|docs/[^/]+\.md|README\.md|LICENSE|\.github/workflows/bench\.yml)$' <<< "$files"; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # Nothing here needs Python: the compiler is built with CMake and Ninja, and the test runner,
  # the benchmarks and the VS Code packager are Calx programs it runs (CLX-104).
  #
  # Each system's tests are split in three (tests/run.calx --shard), each part on a machine of its
  # own, and the other checks are shared out between them. The compiler's objects come from
  # ccache, and each part's build cache from the last run of main, which alone saves them.
  test:
    name: tests (${{ matrix.os }}, ${{ matrix.shard }}/3)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-26.04, ubuntu-24.04-arm, windows-11-arm, macos-latest]
        shard: [1, 2, 3]
        include:
          - os: windows-latest
            calx: build/compiler/windows/calx.exe
          # Named, not ubuntu-latest, which GitHub moves from 24.04 to 26.04 one run at a time
          # from 2026-10-19, so the tests run on one system, the newer.
          - os: ubuntu-26.04
            calx: build/compiler/linux/calx
          # Linux on Arm (D612, CLX-275), whose memory ordering is weaker than x86's, so the
          # runtime's threads are tested where a missing acquire or release would show.
          - os: ubuntu-24.04-arm
            calx: build/compiler/linux/calx
          # A new platform is `experimental: true` until it passes, so its failures don't fail the
          # run. Windows on Arm (CLX-276), with the image's LLVM and Visual Studio's ARM64 tools.
          - os: windows-11-arm
            calx: build/compiler/windows/calx.exe
          # macOS on Apple Silicon (CLX-277 to CLX-280), with Apple's clang and the image's SDK.
          - os: macos-latest
            calx: build/compiler/macos/calx
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      CXX: clang++
      CALX_BIN: ${{ matrix.calx }}
      SHARD: ${{ matrix.shard }}/3
      # Room for everything a part builds, so nothing it will save is dropped.
      CALX_CACHE_MB: 4096
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 300M
      # emit.cpp writes `.incbin` into the C it emits, which ccache takes for the directive and
      # won't cache unless told it isn't one.
      CCACHE_SLOPPINESS: incbin
    steps:
      - uses: actions/checkout@v7
      # The iOS simulator the tests that need one run on (CLX-408), all of them in the first part.
      # It's started first, so it has the whole setup to boot and settle: one booted just before
      # the tests was slow enough that a request to itself in http_wake_on took over 2 s. "Wait for
      # the iOS simulator" waits for it, and says how long the boot took (CLX-424).
      - name: Start the iOS simulator
        if: runner.os == 'macOS' && matrix.shard == 1
        shell: bash
        run: |
          id=$(xcrun simctl list devices available | grep -m1 -E '^ +iPhone' | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          if [ -z "$id" ]; then echo "this runner's Xcode has no iPhone simulator"; exit 1; fi
          xcrun simctl list devices available | grep "$id"
          echo "SIMULATOR=$id" >> "$GITHUB_ENV"
          nohup bash -c 'start=$(date +%s); xcrun simctl bootstatus "$1" -b > "$2/simulator-boot.txt" 2>&1; s=$?; echo "booted in $(( $(date +%s) - start )) s, status $s" >> "$2/simulator-boot.txt"; echo "$s" > "$2/simulator-booted"' \
            _ "$id" "$RUNNER_TEMP" > /dev/null 2>&1 &
      # clang, lld and Ninja from Ubuntu's archive. On 2026-11-11 the runners couldn't resolve its
      # mirrors for over an hour, so if apt can't install them this takes the image's own: its
      # newest clang, with lld from the same LLVM if the image has it, or else from the toolchain
      # the nightly release carries, checked against its SHA-256, and the image's Ninja.
      - name: Install clang, lld and Ninja
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt_opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          if timeout 300 sudo apt-get $apt_opts update && timeout 600 sudo apt-get $apt_opts install -y clang lld ninja-build; then
            exit 0
          fi
          echo "::warning::apt couldn't install clang, lld and Ninja, so this uses the runner image's own"
          llvm=$(ls -d /usr/lib/llvm-[0-9]* | sort -t- -k2 -n | tail -1)
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          ln -s "$llvm/bin/clang" "$bin/clang"
          ln -s "$llvm/bin/clang++" "$bin/clang++"
          if [ -x "$llvm/bin/ld.lld" ]; then
            ln -s "$llvm/bin/ld.lld" "$bin/ld.lld"
          else
            tc="$RUNNER_TEMP/calx-toolchain"
            mkdir -p "$tc"
            arch=x64
            if [ "$(uname -m)" = aarch64 ]; then arch=arm64; fi
            gh release download nightly --repo "$GITHUB_REPOSITORY" --pattern "calx-toolchain-*-linux-$arch.tar.xz*" --dir "$tc"
            (cd "$tc" && sha256sum -c ./*.sha256)
            tar -xJf "$tc"/*.tar.xz -C "$tc" --wildcards '*bin/ld.lld'
            cp "$(find "$tc" -path '*bin/ld.lld' -type f | head -1)" "$bin/ld.lld"
          fi
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/clang" --version | head -1
          "$bin/ld.lld" --version
          ninja --version
      - name: Install Ninja
        if: runner.os == 'macOS'
        run: command -v ninja || brew install ninja
      # Ninja's own release, pinned and checked. GitHub's release downloads fail for minutes at a
      # time now and then, so after a few tries this falls back to the Ninja Visual Studio ships.
      - name: Install Ninja
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "ninja-win.zip"
          $sum = "F550FEC705B6D6FF58F2DB3C374C2277A37691678D6ABA463ADCBB129108467A"
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq "Arm64") {
            $name = "ninja-winarm64.zip"
            $sum = "79C96A50E0DEAFEC212CFA85AA57C6B74003F52D9D1673DDCD1EAB1C958C5900"
          }
          $zip = "$env:RUNNER_TEMP\$name"
          $got = $false
          foreach ($wait in 10, 30, 60) {
            try {
              Invoke-WebRequest "https://github.com/ninja-build/ninja/releases/download/v1.12.1/$name" -OutFile $zip
              $got = $true
              break
            } catch {
              Write-Host "Ninja's download failed: $_"
              Start-Sleep -Seconds $wait
            }
          }
          if ($got) {
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
            if ($hash -ne $sum) { throw "$name's SHA-256 is $hash" }
            Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ninja"
            "$env:RUNNER_TEMP\ninja" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          } else {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            $dir = "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja"
            if (-not (Test-Path "$dir\ninja.exe")) { throw "Ninja's download failed, and Visual Studio has none to fall back to" }
            Write-Host "Using Visual Studio's Ninja, $(& "$dir\ninja.exe" --version)"
            $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
      # Puts the MSVC libraries the linker needs on the environment: whatever Visual Studio's
      # vcvars64.bat, or vcvarsarm64.bat on Arm, sets or changes is kept for the steps after.
      - name: MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tools = "Microsoft.VisualStudio.Component.VC.Tools.x86.x64"
          $vcvars = "vcvars64.bat"
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq "Arm64") {
            $tools = "Microsoft.VisualStudio.Component.VC.Tools.ARM64"
            $vcvars = "vcvarsarm64.bat"
          }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires $tools -property installationPath
          if (-not $vs) { throw "there's no Visual Studio with the C++ tools" }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $lines = cmd /c "`"$vs\VC\Auxiliary\Build\$vcvars`" > nul && set"
          if ($LASTEXITCODE -ne 0) { throw "$vcvars failed" }
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$' -and $before[$matches[1]] -ne $matches[2]) {
              "$($matches[1])=$($matches[2])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            }
          }
      # ccache's own release, pinned and checked, for the compiler's objects. It only saves time, so
      # if it can't be had, the compiler builds without it.
      - name: Install ccache
        continue-on-error: true
        shell: bash
        run: |
          v=4.14.3
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) name=linux-x86_64-musl-static.tar.xz sum=d553fac006ed93a37342cee9228cf4e13dd66690fa1a8075c54c7bace9b72ae6 ;;
            Linux-ARM64) name=linux-aarch64-musl-static.tar.xz sum=f13e56bdb02f62b6f08f54ac527a0a7674dff22ea607167f33621fe2f2ded37b ;;
            macOS-ARM64) name=darwin.tar.gz sum=764dd2a8100ff83e6bbd7b9a1e2016cc401be34bee8a70ea99698186622c34d5 ;;
            Windows-X64) name=windows-x86_64.zip sum=c845c3d65be81954c75659145a522a793a27586bf940c5dcfe18af33fa1a67dd ;;
            Windows-ARM64) name=windows-aarch64.zip sum=4c12ee652936c83b7730ff16f93c86e9e905a91aed9549ce1304185f33c8b3e4 ;;
          esac
          cd "$RUNNER_TEMP"
          file="ccache-$v-$name"
          curl -fsSL --retry 3 --retry-delay 10 -o "$file" "https://github.com/ccache/ccache/releases/download/v$v/$file"
          if [ "$RUNNER_OS" != macOS ]; then
            echo "$sum  $file" | sha256sum -c
          else
            echo "$sum  $file" | shasum -a 256 -c
          fi
          case "$name" in
            *.zip) 7z x -y "$file" > /dev/null ;;
            *) tar -xf "$file" ;;
          esac
          dir="${name%.zip}"
          echo "$RUNNER_TEMP/ccache-$v-${dir%.tar.*}" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      - name: Restore the compiler's objects
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-tests-${{ matrix.os }}-${{ github.run_id }}
          restore-keys: ccache-tests-${{ matrix.os }}-
      # The build cache of this part's tests from main's last run: a test whose C is the same as
      # then needs no clang, the same C, flags and clang making the same object.
      - name: Restore the build cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/calx-cache
          key: calx-tests-${{ matrix.os }}-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: calx-tests-${{ matrix.os }}-${{ matrix.shard }}-
      - name: Toolchain
        shell: bash
        run: |
          clang --version
          echo "CALX_CACHE=$RUNNER_TEMP/calx-cache" >> "$GITHUB_ENV"
      - name: Build the compiler
        shell: bash
        run: |
          dir=$(dirname "$CALX_BIN")
          launcher=()
          if command -v ccache > /dev/null; then launcher=(-DCMAKE_CXX_COMPILER_LAUNCHER=ccache); fi
          cmake -S compiler -B "$dir" -G Ninja -DCMAKE_CXX_COMPILER=clang++ "${launcher[@]}" > /dev/null
          ninja -C "$dir"
          if command -v ccache > /dev/null; then ccache -s; fi
      - name: Check the release tools and the art script
        if: matrix.shard == 1
        shell: bash
        run: for f in tools/update/update.calx tools/release/package.calx tools/release/toolchain.calx tools/mdns/interop.calx assets/logo/banner.calx; do "$CALX_BIN" check "$f"; done
      # `calx update --to` and the install script with CALX_VERSION, from a mirror on loopback: a
      # nightly from its own release, and an older one from the nightly release.
      - name: Install a version by its own release
        if: matrix.shard == 1
        shell: bash
        run: '"$CALX_BIN" run tools/install/test.calx -- "$CALX_BIN"'
      # Calx's own code in its one format (CLX-160). The suite checks the tests' files.
      - name: Formatting
        if: matrix.shard == 1
        shell: bash
        run: '"$CALX_BIN" fmt --check std tools bench assets tests/run.calx'
      # The tests find the simulator running and leave it so. After `bootstatus` returns, the
      # first program started on it can take over a minute to run, longer than a test on it may
      # take, so a program built for it is run on it until it runs in under 5 seconds (CLX-442).
      # The system's own programs can't be: simctl finds macOS's /usr/bin/true, which has no
      # libSystem there.
      - name: Wait for the iOS simulator
        if: runner.os == 'macOS' && matrix.shard == 1
        shell: bash
        run: |
          for i in $(seq 1 900); do
            if [ -f "$RUNNER_TEMP/simulator-booted" ]; then break; fi
            sleep 1
          done
          tail -n 3 "$RUNNER_TEMP/simulator-boot.txt"
          if [ "$(cat "$RUNNER_TEMP/simulator-booted" 2> /dev/null)" != 0 ]; then echo "the iOS simulator didn't boot"; exit 1; fi
          "$CALX_BIN" build --target aarch64-ios-sim tests/basics/hello.calx -o build/hello-sim
          for i in $(seq 1 30); do
            start=$(date +%s)
            ran=yes
            xcrun simctl spawn "$SIMULATOR" "$PWD/build/hello-sim" > /dev/null || ran=no
            took=$(( $(date +%s) - start ))
            echo "a program run on it: $ran, in $took s"
            if [ "$ran" = yes ] && [ "$took" -lt 5 ]; then break; fi
          done
      # A part takes 2 to 8 minutes. The step's own limit, unlike the job's, leaves its log when
      # a test hangs. On macOS the step's shell is in the runner's own process group, and three
      # runs' macOS jobs stopped answering mid-tests with no log, so there the tests run in a
      # session of their own, and a signal that ends the runner is said.
      - name: Tests
        shell: bash
        timeout-minutes: 20
        run: |
          set -- "$CALX_BIN" run --release tests/run.calx -- --modes debug,release --shard "$SHARD"
          if [ "$RUNNER_OS" != macOS ]; then
            exec "$@"
          fi
          exec perl -MPOSIX -e '
            my $pid = fork() // die "fork: $!";
            if ($pid == 0) { POSIX::setsid() or die "setsid: $!"; exec(@ARGV) or die "exec: $!"; }
            waitpid($pid, 0);
            if ($? & 127) { print STDERR "tests/run.calx was ended by signal ", $? & 127, "\n"; exit 1; }
            exit($? >> 8);
          ' "$@"
      # std.net.mdns beside the system's own responder (CLX-412): it finds a service avahi or
      # Bonjour announces, and avahi-browse or dns-sd finds and resolves one it announces, with
      # its TXT record. On Windows the tests run beside Windows' own responder already. On macOS
      # it runs as root, since the runner's programs haven't the permission for the local network
      # that macOS asks for (TN3179), and root needs none.
      - name: mDNS with avahi and Bonjour
        if: matrix.shard == 3 && ((runner.os == 'Linux' && runner.arch == 'X64') || runner.os == 'macOS')
        shell: bash
        run: |
          set -eu
          out="$RUNNER_TEMP/mdns-interop"
          "$CALX_BIN" build tools/mdns/interop.calx -o "$out"
          interop() {
            if [ "$RUNNER_OS" = macOS ]; then sudo "$out" "$@"; else "$out" "$@"; fi
          }
          kind=_calxci._tcp
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y -qq avahi-daemon avahi-utils > /dev/null
            sudo systemctl start avahi-daemon
            avahi-publish -s "Avahi Side" "$kind" 4322 id=av &
          else
            dns-sd -R "Bonjour Side" "$kind" local 4322 id=bj &
          fi
          other=$!
          if [ "$RUNNER_OS" = Linux ]; then
            interop find "$kind" "Avahi Side" id=av
          else
            interop find "$kind" "Bonjour Side" id=bj
          fi
          kill "$other"
          interop announce "$kind" "Calx Side" 25 id=ca &
          calx=$!
          sleep 3
          if [ "$RUNNER_OS" = Linux ]; then
            avahi-browse -rpt "$kind" | tee "$RUNNER_TEMP/browse.txt"
            grep -q '"id=ca"' "$RUNNER_TEMP/browse.txt"
          else
            dns-sd -B "$kind" local > "$RUNNER_TEMP/browse.txt" &
            browse=$!
            dns-sd -L "Calx Side" "$kind" local > "$RUNNER_TEMP/lookup.txt" &
            lookup=$!
            sleep 6
            kill "$browse" "$lookup"
            cat "$RUNNER_TEMP/browse.txt" "$RUNNER_TEMP/lookup.txt"
            grep -q 'Calx Side' "$RUNNER_TEMP/browse.txt"
            grep -q 'id=ca' "$RUNNER_TEMP/lookup.txt"
          fi
          wait "$calx"
      # A handoff between threads that's missing its ordering fails only now and then, so on Arm
      # the parallel and thread tests run 20 more times (CLX-274).
      - name: Threads, again and again
        if: matrix.shard == 3 && runner.arch == 'ARM64'
        shell: bash
        run: for i in $(seq 1 20); do "$CALX_BIN" run --release tests/run.calx -- --modes release tests/parallel tests/thread || exit 1; done
      # A full run must print the expected checksum, with one thread and with several. The
      # times on a shared runner are only a rough guide.
      - name: Tick benchmark
        if: matrix.shard == 2
        shell: bash
        run: '"$CALX_BIN" run bench/run.calx -- calx --threads 1,4 --runs 1'
      - name: Build times
        if: matrix.shard == 2
        shell: bash
        run: '"$CALX_BIN" run bench/build.calx -- --runs 3'
      # The VS Code extension, packaged as a .vsix, kept as an artifact, so it can be installed
      # without a checkout. The vscode job tests it.
      - name: Package the VS Code extension
        if: matrix.shard == 2 && runner.os == 'Linux' && runner.arch == 'X64'
        run: '"$CALX_BIN" run tools/vscode/package.calx'
      - uses: actions/upload-artifact@v7
        if: matrix.shard == 2 && runner.os == 'Linux' && runner.arch == 'X64'
        with:
          name: calx-vscode
          path: build/vscode/*.vsix
      # Main's caches, for the runs after it, pull requests' too; a pull request's own would be
      # seen only by its own branch, and crowd main's out of the repository's 10 GB. Programs are
      # left out: they're most of the cache, and linking one again is quick.
      - name: Trim the build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -eu
          case "$CALX_CACHE" in
            */calx-cache) rm -rf -- "$CALX_CACHE/bin" ;;
            *) echo "CALX_CACHE is $CALX_CACHE"; exit 1 ;;
          esac
          du -sh "$CALX_CACHE"
      - name: Save the build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/calx-cache
          key: calx-tests-${{ matrix.os }}-${{ matrix.shard }}-${{ github.run_id }}
      - name: Save the compiler's objects
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 1
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-tests-${{ matrix.os }}-${{ github.run_id }}

  # A release of every push to main that passes, as the nightly, and of every v* tag, which must
  # match VERSION, as a stable release (CLX-81). Each platform builds the compiler with its
  # version, commit and date stamped in, builds calx-update with it, and packages both with the
  # runtime and std (tools/release/package.calx), with the toolchain programs are built with as an
  # archive of its own (CLX-110, CLX-251). Then it serves those from here, installs them with the
  # install script, as a user would, and builds and tests programs with what's installed. It runs
  # beside the tests, and publish waits for both.
  package:
    name: package (${{ matrix.platform }}-${{ matrix.cpu }})
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            cpu: x64
          # The oldest supported Ubuntu, so the release runs on glibc 2.35 and later.
          - os: ubuntu-22.04
            platform: linux
            cpu: x64
          # Linux on Arm (CLX-275), Windows on Arm (CLX-276) and macOS on Apple Silicon (CLX-280).
          # A new one is `experimental: true`, as in the test job, until it passes.
          - os: ubuntu-22.04-arm
            platform: linux
            cpu: arm64
          - os: windows-11-arm
            platform: windows
            cpu: arm64
          - os: macos-latest
            platform: macos
            cpu: arm64
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 300M
      CCACHE_SLOPPINESS: incbin
    steps:
      - uses: actions/checkout@v7
      # As in the test job.
      - name: Install ccache
        continue-on-error: true
        shell: bash
        run: |
          v=4.14.3
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) name=linux-x86_64-musl-static.tar.xz sum=d553fac006ed93a37342cee9228cf4e13dd66690fa1a8075c54c7bace9b72ae6 ;;
            Linux-ARM64) name=linux-aarch64-musl-static.tar.xz sum=f13e56bdb02f62b6f08f54ac527a0a7674dff22ea607167f33621fe2f2ded37b ;;
            macOS-ARM64) name=darwin.tar.gz sum=764dd2a8100ff83e6bbd7b9a1e2016cc401be34bee8a70ea99698186622c34d5 ;;
            Windows-X64) name=windows-x86_64.zip sum=c845c3d65be81954c75659145a522a793a27586bf940c5dcfe18af33fa1a67dd ;;
            Windows-ARM64) name=windows-aarch64.zip sum=4c12ee652936c83b7730ff16f93c86e9e905a91aed9549ce1304185f33c8b3e4 ;;
          esac
          cd "$RUNNER_TEMP"
          file="ccache-$v-$name"
          curl -fsSL --retry 3 --retry-delay 10 -o "$file" "https://github.com/ccache/ccache/releases/download/v$v/$file"
          if [ "$RUNNER_OS" != macOS ]; then
            echo "$sum  $file" | sha256sum -c
          else
            echo "$sum  $file" | shasum -a 256 -c
          fi
          case "$name" in
            *.zip) 7z x -y "$file" > /dev/null ;;
            *) tar -xf "$file" ;;
          esac
          dir="${name%.zip}"
          echo "$RUNNER_TEMP/ccache-$v-${dir%.tar.*}" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      - name: Restore the compiler's objects
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-package-${{ matrix.platform }}-${{ matrix.cpu }}-${{ github.run_id }}
          restore-keys: ccache-package-${{ matrix.platform }}-${{ matrix.cpu }}-
      - name: Install Ninja
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "ninja-win.zip"
          $sum = "F550FEC705B6D6FF58F2DB3C374C2277A37691678D6ABA463ADCBB129108467A"
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq "Arm64") {
            $name = "ninja-winarm64.zip"
            $sum = "79C96A50E0DEAFEC212CFA85AA57C6B74003F52D9D1673DDCD1EAB1C958C5900"
          }
          $zip = "$env:RUNNER_TEMP\$name"
          $got = $false
          foreach ($wait in 10, 30, 60) {
            try {
              Invoke-WebRequest "https://github.com/ninja-build/ninja/releases/download/v1.12.1/$name" -OutFile $zip
              $got = $true
              break
            } catch {
              Write-Host "Ninja's download failed: $_"
              Start-Sleep -Seconds $wait
            }
          }
          if ($got) {
            $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
            if ($hash -ne $sum) { throw "$name's SHA-256 is $hash" }
            Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ninja"
            "$env:RUNNER_TEMP\ninja" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          } else {
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            $dir = "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja"
            if (-not (Test-Path "$dir\ninja.exe")) { throw "Ninja's download failed, and Visual Studio has none to fall back to" }
            Write-Host "Using Visual Studio's Ninja, $(& "$dir\ninja.exe" --version)"
            $dir | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
      # Puts the MSVC libraries the linker needs on the environment: whatever Visual Studio's
      # vcvars64.bat, or vcvarsarm64.bat on Arm, sets or changes is kept for the steps after.
      - name: MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tools = "Microsoft.VisualStudio.Component.VC.Tools.x86.x64"
          $vcvars = "vcvars64.bat"
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq "Arm64") {
            $tools = "Microsoft.VisualStudio.Component.VC.Tools.ARM64"
            $vcvars = "vcvarsarm64.bat"
          }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires $tools -property installationPath
          if (-not $vs) { throw "there's no Visual Studio with the C++ tools" }
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $lines = cmd /c "`"$vs\VC\Auxiliary\Build\$vcvars`" > nul && set"
          if ($LASTEXITCODE -ne 0) { throw "$vcvars failed" }
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$' -and $before[$matches[1]] -ne $matches[2]) {
              "$($matches[1])=$($matches[2])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            }
          }
      # The toolchain a release builds programs with, so building one needs nothing else installed
      # (CLX-110): clang and lld from LLVM's own release, and on Windows mingw-w64's headers and
      # libraries from llvm-mingw's, of the same LLVM version, pinned and checked, which
      # tools/release/toolchain.calx puts together. What's taken from LLVM's release is kept in
      # the cache under its version, so it's downloaded once.
      - name: Restore LLVM
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/llvm
          key: llvm-23.1.5-${{ matrix.platform }}-${{ matrix.cpu }}
      - name: Fetch the toolchain
        if: runner.os == 'Linux'
        run: |
          if [ "$(uname -m)" = aarch64 ]; then
            llvm=LLVM-23.1.5-Linux-ARM64
            sum=830ceb70edf63849ce66e97bf85310a3bf2bdd04c860a9f2fa4ef1560e290cef
          else
            llvm=LLVM-23.1.5-Linux-X64
            sum=c3107384835f788768f614db610e87fba7077f125ca950eb02a78bab0a308065
          fi
          echo "LLVM_RELEASE=$RUNNER_TEMP/llvm/$llvm" >> "$GITHUB_ENV"
          if [ -d "$RUNNER_TEMP/llvm/$llvm" ]; then exit 0; fi
          for wait in 10 30 60 0; do
            curl -fsSL -o "$RUNNER_TEMP/$llvm.tar.zst" "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/$llvm.tar.zst" && break
            if [ "$wait" = 0 ]; then echo "LLVM's download failed"; exit 1; fi
            echo "LLVM's download failed; trying again in $wait s"
            sleep "$wait"
          done
          echo "$sum  $RUNNER_TEMP/$llvm.tar.zst" | sha256sum -c
          # Only what the toolchain takes from it: the whole release is 10 GB unpacked. Its zstd
          # window is 1 GiB, which zstd decodes only when told to.
          mkdir -p "$RUNNER_TEMP/llvm"
          tar -I 'zstd -d --long=31' -xf "$RUNNER_TEMP/$llvm.tar.zst" -C "$RUNNER_TEMP/llvm" "$llvm/bin/clang-23" "$llvm/bin/lld" \
            "$llvm/bin/llvm-strip" "$llvm/bin/llvm-objcopy" "$llvm/lib/clang/23" "$llvm/include/llvm/Support/LICENSE.TXT"
          rm "$RUNNER_TEMP/$llvm.tar.zst"
      # On macOS: LLVM's Apple Silicon release, for clang, ld64.lld and dsymutil, with the SDK from
      # the runner's Command Line Tools, as a user's comes. The compiler is built with Apple's clang.
      - name: Fetch the toolchain
        if: runner.os == 'macOS'
        run: |
          command -v ninja > /dev/null || brew install ninja
          llvm=LLVM-23.1.5-macOS-ARM64
          sum=503de30ef90311e0b143623801b19af2250adac6d69faed65ad0051170202e3b
          echo "LLVM_RELEASE=$RUNNER_TEMP/llvm/$llvm" >> "$GITHUB_ENV"
          if [ -d "$RUNNER_TEMP/llvm/$llvm" ]; then exit 0; fi
          command -v zstd > /dev/null || brew install zstd
          for wait in 10 30 60 0; do
            curl -fsSL -o "$RUNNER_TEMP/$llvm.tar.zst" "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/$llvm.tar.zst" && break
            if [ "$wait" = 0 ]; then echo "LLVM's download failed"; exit 1; fi
            echo "LLVM's download failed; trying again in $wait s"
            sleep "$wait"
          done
          echo "$sum  $RUNNER_TEMP/$llvm.tar.zst" | shasum -a 256 -c
          zstd -d -q --long=31 "$RUNNER_TEMP/$llvm.tar.zst" -o "$RUNNER_TEMP/$llvm.tar"
          rm "$RUNNER_TEMP/$llvm.tar.zst"
          mkdir -p "$RUNNER_TEMP/llvm"
          tar -xf "$RUNNER_TEMP/$llvm.tar" -C "$RUNNER_TEMP/llvm" "$llvm/bin/clang-23" "$llvm/bin/lld" "$llvm/bin/dsymutil" \
            "$llvm/bin/llvm-strip" "$llvm/bin/llvm-objcopy" "$llvm/lib/clang/23" "$llvm/include/llvm/Support/LICENSE.TXT"
          rm "$RUNNER_TEMP/$llvm.tar"
      # The compiler is built with clang 20 from LLVM's apt repository, and lld beside it: those
      # alone, since llvm.sh adds lldb, whose libraries come from Ubuntu's mirrors, which the
      # runners can't always reach (CLX-268). When apt can't install them, it's built with the
      # clang 23 just fetched for the toolchain.
      - name: Install clang, lld and Ninja
        if: runner.os == 'Linux'
        run: |
          apt_opts="-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          codename=$(lsb_release -cs)
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$codename/ llvm-toolchain-$codename-20 main" | sudo tee /etc/apt/sources.list.d/llvm-20.list > /dev/null
          if timeout 300 sudo apt-get $apt_opts update && timeout 600 sudo apt-get $apt_opts install -y --no-install-recommends clang-20 lld-20 ninja-build; then
            echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          echo "::warning::apt couldn't install clang 20, so the compiler is built with the toolchain's clang 23"
          bin="$RUNNER_TEMP/llvm-bin"
          mkdir -p "$bin"
          ln -s "$LLVM_RELEASE/bin/clang-23" "$bin/clang"
          ln -s "$LLVM_RELEASE/bin/clang-23" "$bin/clang++"
          ln -s "$LLVM_RELEASE/bin/lld" "$bin/ld.lld"
          if ! command -v ninja > /dev/null; then
            zip=ninja-linux.zip
            sum=6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255
            if [ "$(uname -m)" = aarch64 ]; then
              zip=ninja-linux-aarch64.zip
              sum=5c25c6570b0155e95fce5918cb95f1ad9870df5768653afe128db822301a05a1
            fi
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$zip" "https://github.com/ninja-build/ninja/releases/download/v1.12.1/$zip"
            echo "$sum  $RUNNER_TEMP/$zip" | sha256sum -c
            unzip -q "$RUNNER_TEMP/$zip" -d "$bin"
          fi
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/clang++" --version | head -1
          "$bin/ld.lld" --version
          PATH="$bin:$PATH" ninja --version
      - name: Fetch the toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          function Get-Pinned($url, $file, $sha256) {
            foreach ($wait in 10, 30, 60, 0) {
              try {
                Invoke-WebRequest $url -OutFile $file
                break
              } catch {
                if ($wait -eq 0) { throw "the download of $url failed: $_" }
                Write-Host "the download of $url failed: $_"
                Start-Sleep -Seconds $wait
              }
            }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash
            if ($hash -ne $sha256) { throw "$file's SHA-256 is $hash" }
          }
          $ProgressPreference = 'SilentlyContinue'
          # The processor's builds of both (CLX-276).
          $mingw = "llvm-mingw-20261104-ucrt-x86_64"
          $mingw_sum = "552191B5754C49A5A20723276A6FC56541EA1922C4C50B7B669022333FC1B40F"
          $llvm = "clang+llvm-23.1.5-x86_64-pc-windows-msvc"
          $llvm_sum = "B2BE33385DDC86E83511417A060DE927AE8B09D1F3017CC3CDCE5C73CD5029D7"
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq "Arm64") {
            $mingw = "llvm-mingw-20261104-ucrt-aarch64"
            $mingw_sum = "7D7F8387A8706639B0B47A629D6E23F8B3EF9ACCE67E9832B8CD4C5BB2816EAB"
            $llvm = "clang+llvm-23.1.5-aarch64-pc-windows-msvc"
            $llvm_sum = "CB523582D9FE00862C5584CE5F7715F963037C11BBA95181FA98425F48E06863"
          }
          Get-Pinned "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/$mingw.zip" "$env:RUNNER_TEMP\$mingw.zip" $mingw_sum
          7z x -y "-o$env:RUNNER_TEMP" "$env:RUNNER_TEMP\$mingw.zip" > $null
          "LLVM_MINGW=$env:RUNNER_TEMP\$mingw" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "LLVM_RELEASE=$env:RUNNER_TEMP\llvm\$llvm" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          if (Test-Path "$env:RUNNER_TEMP\llvm\$llvm") { exit 0 }
          Get-Pinned "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/$llvm.tar.zst" "$env:RUNNER_TEMP\$llvm.tar.zst" $llvm_sum
          # Only what the toolchain takes from it: the whole release is 4 GB unpacked. Its zstd
          # window is 1 GiB, which only zstd itself decodes when told to.
          zstd -d -q --long=31 "$env:RUNNER_TEMP\$llvm.tar.zst" -o "$env:RUNNER_TEMP\$llvm.tar"
          if ($LASTEXITCODE -ne 0) { throw "can't decompress $llvm.tar.zst" }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\llvm" > $null
          & "$env:SystemRoot\System32\tar.exe" -xf "$env:RUNNER_TEMP\$llvm.tar" -C "$env:RUNNER_TEMP\llvm" `
            "$llvm/bin/clang.exe" "$llvm/bin/lld.exe" "$llvm/lib/clang"
          if ($LASTEXITCODE -ne 0) { throw "can't unpack $llvm.tar" }
          Remove-Item "$env:RUNNER_TEMP\$llvm.tar", "$env:RUNNER_TEMP\$llvm.tar.zst"
      - name: Version
        id: version
        shell: bash
        run: |
          base=$(head -n1 VERSION)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$base" ]]; then
              echo "the tag $GITHUB_REF_NAME doesn't match VERSION, which says $base"
              exit 1
            fi
          else
            version="$base-nightly.$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y%m%d%H%M)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore the toolchain's archive
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/toolchain-archives
          key: toolchain-archive-${{ matrix.platform }}-${{ matrix.cpu }}-${{ github.run_id }}
          restore-keys: toolchain-archive-${{ matrix.platform }}-${{ matrix.cpu }}-
      # Booting while the release is built, once the caches are restored, as in the test job.
      - name: Start the iOS simulator
        if: runner.os == 'macOS'
        shell: bash
        run: |
          id=$(xcrun simctl list devices available | grep -m1 -E '^ +iPhone' | grep -oE '[0-9A-F]{8}(-[0-9A-F]{4}){3}-[0-9A-F]{12}')
          if [ -z "$id" ]; then echo "this runner's Xcode has no iPhone simulator"; exit 1; fi
          xcrun simctl list devices available | grep "$id"
          echo "SIMULATOR=$id" >> "$GITHUB_ENV"
          nohup bash -c 'start=$(date +%s); xcrun simctl bootstatus "$1" -b > "$2/simulator-boot.txt" 2>&1; s=$?; echo "booted in $(( $(date +%s) - start )) s, status $s" >> "$2/simulator-boot.txt"; echo "$s" > "$2/simulator-booted"' \
            _ "$id" "$RUNNER_TEMP" > /dev/null 2>&1 &
      - name: Build and package
        id: build
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
          DATE: ${{ steps.version.outputs.date }}
          # A code-signing certificate, as a base64 .pfx, and its password: with them, calx and
          # calx-update are signed on Windows before they're packaged (CLX-414). Without them, as
          # in a fork, nothing is signed.
          SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          exe=""
          link=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            exe=".exe"
          elif [[ "$RUNNER_OS" == Linux ]]; then
            # libstdc++ inside, so the compiler needs only the C library.
            link=("-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc")
          else
            # Every macOS has libc++; this one runs on the first for Apple Silicon, as programs do.
            link=("-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0")
          fi
          if command -v ccache > /dev/null; then link+=(-DCMAKE_CXX_COMPILER_LAUNCHER=ccache); fi
          # The C runtime inside on Windows too, so no redistributable needs installing.
          cmake -S compiler -B build/release -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded "${link[@]}" \
            "-DCALX_VERSION=$VERSION" "-DCALX_COMMIT=$COMMIT" "-DCALX_DATE=$DATE"
          ninja -C build/release
          if command -v ccache > /dev/null; then ccache -s; fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            build/release/calx$exe run tools/release/toolchain.calx -- windows "$LLVM_MINGW" "$LLVM_RELEASE" \
              build/toolchain "LLVM 23.1.5, llvm-mingw 20261104"
          else
            build/release/calx$exe run tools/release/toolchain.calx -- ${{ matrix.platform }} "$LLVM_RELEASE" build/toolchain "LLVM 23.1.5"
          fi
          # calx-update built with the toolchain, as a user's programs are.
          export CALX_CC="$PWD/build/toolchain/bin/clang$exe"
          build/release/calx$exe build --release tools/update/update.calx -o build/release/calx-update$exe
          # package.calx signs with signtool, which the MSVC environment put on PATH.
          if [[ "$RUNNER_OS" == Windows && -n "$SIGNING_CERT" ]]; then
            printf '%s' "$SIGNING_CERT" | base64 -d > "$RUNNER_TEMP/signing.pfx"
            export CALX_SIGN_CERT="$RUNNER_TEMP/signing.pfx" CALX_SIGN_PASSWORD="$SIGNING_PASSWORD"
          fi
          # An archive of this toolchain from an earlier run, used if it holds the same files, as
          # compressing it takes minutes. One made anew is kept for the next run.
          export CALX_TOOLCHAIN_ARCHIVES="$RUNNER_TEMP/toolchain-archives"
          build/release/calx$exe run tools/release/package.calx -- "$VERSION" ${{ matrix.platform }} \
            build/release/calx$exe build/release/calx-update$exe build/dist build/toolchain
          rm -f "$RUNNER_TEMP/signing.pfx"
          for f in build/dist/calx-toolchain-*.tar.xz; do
            if ! cmp -s "$f" "$CALX_TOOLCHAIN_ARCHIVES/${f##*/}"; then
              rm -rf -- "${RUNNER_TEMP:?}/toolchain-archives"
              mkdir -p "$CALX_TOOLCHAIN_ARCHIVES"
              cp "$f" "$CALX_TOOLCHAIN_ARCHIVES/"
              echo "toolchain=new" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Save the toolchain's archive
        if: steps.build.outputs.toolchain == 'new'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/toolchain-archives
          key: toolchain-archive-${{ matrix.platform }}-${{ matrix.cpu }}-${{ github.run_id }}
      - name: Save the compiler's objects
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-package-${{ matrix.platform }}-${{ matrix.cpu }}-${{ github.run_id }}
      - name: Install the release
        shell: bash
        run: |
          # The release as GitHub will serve it, from here, by the calx just built, on loopback.
          # Each version is in its own release, and the nightly release's version.txt names it.
          version=$(head -n1 build/dist/version.txt)
          mkdir -p "build/mirror/download/v$version" build/mirror/download/nightly
          cp build/dist/* "build/mirror/download/v$version/"
          cp build/dist/version.txt build/mirror/download/nightly/version.txt
          exe=""
          if [[ "$RUNNER_OS" == Windows ]]; then exe=".exe"; fi
          build/release/calx$exe serve build/mirror --port 18767 > build/serve.log 2>&1 &
          serve=$!
          for i in $(seq 1 120); do curl -s -o /dev/null http://127.0.0.1:18767/ && break; sleep 1; done
          # Installed by the install script, as a user installs it, toolchain and all.
          if [[ "$RUNNER_OS" == Windows ]]; then
            CALX_RELEASES=http://127.0.0.1:18767 CALX_INSTALL="$(cygpath -w "$PWD/build/try")" CALX_CHANNEL=nightly \
              CALX_NO_MODIFY_PATH=1 pwsh -NoProfile -File tools/install/install.ps1
          else
            CALX_RELEASES=http://127.0.0.1:18767 CALX_INSTALL="$PWD/build/try" CALX_CHANNEL=nightly \
              CALX_NO_MODIFY_PATH=1 sh tools/install/install.sh
          fi
          kill "$serve"
          calx=build/try/bin/calx$exe
          "$calx" version
          "$calx" run tests/basics/hello.calx
          "$calx" run --release tests/basics/hello.calx
          # Builds with the clang it carries, not one on PATH: the tests that reach the system the
          # most, libraries, and stack traces, which read the PDBs on Windows.
          "$calx" doctor | tee build/doctor.txt
          grep -q "the one Calx carries" build/doctor.txt
      # The build cache of the last run whose release carried exactly this toolchain, every file
      # of it the same, so the cache can't stand in for one the toolchain no longer has.
      - name: The installed toolchain
        id: toolchain
        shell: bash
        run: echo "hash=${{ hashFiles('build/try/toolchain/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the build cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/calx-cache
          key: calx-release-${{ matrix.platform }}-${{ matrix.cpu }}-${{ steps.toolchain.outputs.hash }}-${{ github.run_id }}
          restore-keys: calx-release-${{ matrix.platform }}-${{ matrix.cpu }}-${{ steps.toolchain.outputs.hash }}-
      # The simulator started at the job's start (CLX-442), as in the test job.
      - name: Wait for the iOS simulator
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for i in $(seq 1 900); do
            if [ -f "$RUNNER_TEMP/simulator-booted" ]; then break; fi
            sleep 1
          done
          tail -n 3 "$RUNNER_TEMP/simulator-boot.txt"
          if [ "$(cat "$RUNNER_TEMP/simulator-booted" 2> /dev/null)" != 0 ]; then echo "the iOS simulator didn't boot"; exit 1; fi
          build/release/calx build --target aarch64-ios-sim tests/basics/hello.calx -o build/hello-sim
          for i in $(seq 1 30); do
            start=$(date +%s)
            ran=yes
            xcrun simctl spawn "$SIMULATOR" "$PWD/build/hello-sim" > /dev/null || ran=no
            took=$(( $(date +%s) - start ))
            echo "a program run on it: $ran, in $took s"
            if [ "$ran" = yes ] && [ "$took" -lt 5 ]; then break; fi
          done
      - name: Test the release
        shell: bash
        env:
          CALX_CACHE: ${{ runner.temp }}/calx-cache
          CALX_CACHE_MB: 4096
        run: |
          exe=""
          if [[ "$RUNNER_OS" == Windows ]]; then exe=".exe"; fi
          calx=build/try/bin/calx$exe
          "$calx" run --release tests/run.calx -- --modes debug,release tests/std tests/library tests/panics
          # Reaches GitHub over HTTPS. Before the first nightly is published there's nothing to find.
          "$calx" update --check || echo "(no release to compare with yet)"
      - name: Trim the build cache
        if: github.event_name == 'push'
        shell: bash
        env:
          CALX_CACHE: ${{ runner.temp }}/calx-cache
        run: |
          set -eu
          case "$CALX_CACHE" in
            */calx-cache) rm -rf -- "$CALX_CACHE/bin" ;;
            *) echo "CALX_CACHE is $CALX_CACHE"; exit 1 ;;
          esac
          du -sh "$CALX_CACHE"
      - name: Save the build cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/calx-cache
          key: calx-release-${{ matrix.platform }}-${{ matrix.cpu }}-${{ steps.toolchain.outputs.hash }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.cpu }}
          path: build/dist/*

  # Publishes what the package jobs made, once every part of the tests has passed too. A tag
  # becomes a release of its own. A push to main becomes a release of its own too, vVERSION, a
  # prerelease that's never the latest and never deleted, so a nightly can be pinned and installed
  # by its version later. Then it replaces the nightly release's files: the archives first, then
  # version.txt, which names the newest, so it never points at one that isn't there yet. The
  # archives of all but the last two nightlies go, the one before staying for a download that
  # started before this one. A
  # toolchain's archive is the same bytes from the same toolchain, so one the nightly has is left
  # as it is, and none goes, since an older nightly may name it.
  publish:
    name: publish
    needs: [test, package]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.test.result == 'success' && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish
        working-directory: dist
        run: |
          version=$(head -n1 version.txt)
          sha256sum calx-*.zip calx-*.tar.gz calx-*.tar.xz > SHA256SUMS
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" calx-* SHA256SUMS version.txt --verify-tag \
              --title "Calx $version" --generate-notes
            exit 0
          fi
          # GITHUB_TOKEN can't point a ref at a commit whose workflows differ from main's tip, as
          # they do when a push that changes them lands while this runs. That push's own run
          # publishes the nightly then, so this one leaves it.
          workflows() { gh api "repos/$GH_REPO/contents/.github/workflows?ref=$1" --jq '[.[] | "\(.name) \(.sha)"] | sort | join(",")'; }
          if [ "$(workflows "$GITHUB_SHA")" != "$(workflows main)" ]; then
            echo "::notice::main has moved on with changes to the workflows, so its own run publishes the nightly"
            exit 0
          fi
          # The nightly's own release, with everything it names, toolchains too, before the
          # nightly release's version.txt names it. A run that's tried again adds what's missing.
          own="v$version"
          if ! gh release view "$own" > /dev/null 2>&1; then
            gh release create "$own" --prerelease --latest=false --target "$GITHUB_SHA" --title "Calx $version" \
              --notes "A nightly: the build of $GITHUB_SHA. \`calx update --to $version\` installs it, as does CALX_VERSION=$version with the install scripts."
          fi
          gh release upload "$own" calx-* SHA256SUMS version.txt --clobber
          # Runs of main overlap and reach this in any order, so one whose commit the nightly has
          # already moved past leaves it, rather than putting an older build back (CLX-286).
          if current=$(gh api "repos/$GH_REPO/git/ref/tags/nightly" --jq .object.sha 2> /dev/null); then
            if [ "$(gh api "repos/$GH_REPO/compare/$GITHUB_SHA...$current" --jq .status)" = ahead ]; then
              echo "::notice::the nightly is from $current, which is newer than $GITHUB_SHA, so it stays"
              exit 0
            fi
          fi
          notes="The newest build of main that passed CI: Calx $version, from $GITHUB_SHA. \`calx update --nightly\` follows these."
          if gh release view nightly > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit nightly --notes "$notes"
          else
            gh release create nightly --prerelease --target "$GITHUB_SHA" --title "Nightly" --notes "$notes"
          fi
          for f in calx-toolchain-*.tar.xz; do
            if gh release download nightly -p "$f.sha256" -O - 2> /dev/null | cmp -s - "$f.sha256"; then
              rm "$f" "$f.sha256"
            fi
          done
          gh release upload nightly calx-*.zip calx-*.tar.gz calx-*.sha256 $(ls calx-toolchain-*.tar.xz 2> /dev/null) --clobber
          gh release upload nightly SHA256SUMS version.txt --clobber
          keep=$(gh release view nightly --json assets --jq '.assets[].name' | grep -oE 'calx-[0-9][^-]*-nightly\.[0-9]+' | sort -u -V | tail -n 2)
          # Each archive's version is the part of its name before the system, whichever system.
          gh release view nightly --json assets --jq '.assets[].name' | grep '^calx-' | grep -v '^calx-toolchain-' | while read -r name; do
            version=$(grep -oE '^calx-[0-9][^-]*-nightly\.[0-9]+' <<< "$name" || true)
            if [ -n "$version" ] && ! grep -qxF "$version" <<< "$keep"; then
              gh release delete-asset nightly "$name" --yes
            fi
          done

  # The VS Code extension: its grammar on every example in the repo, and its helpers. The test
  # job on Linux packages it.
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/vscode/package-lock.json
      - name: Install the test dependencies
        working-directory: tools/vscode
        run: npm ci
      - name: Tests
        working-directory: tools/vscode
        run: npm test

  # The one check to require: it passes when every part of the tests and the extension's tests
  # passed, or skipped them for a pull request that changes nothing they test.
  ci:
    name: ci
    if: always()
    needs: [changes, test, vscode]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ] && [ "$r" != skipped ]; then exit 1; fi
          done
