# Builds the compiler and runs the test suite, including every example in the reference docs
# (D41), in debug and release builds on both platforms Calx targets.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install clang, lld and Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld ninja-build
      - name: Install Ninja
        if: runner.os == 'Windows'
        run: python -m pip install ninja
      # Puts the MSVC libraries the linker needs on the environment.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Toolchain
        run: clang --version
      - name: Tests
        run: python -I tests/run.py --modes debug,release

  # The VS Code extension: its grammar on every example in the repo, and its helpers. The
  # packaged .vsix is kept as an artifact, so it can be installed without a checkout.
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/vscode/package-lock.json
      - name: Install the test dependencies
        working-directory: tools/vscode
        run: npm ci
      - name: Tests
        working-directory: tools/vscode
        run: npm test
      - name: Package
        run: python3 -I tools/vscode/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: calx-vscode
          path: build/vscode/*.vsix
