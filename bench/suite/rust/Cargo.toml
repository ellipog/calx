# The Rust versions of bench/suite's programs, one binary each, built as bench/suite.calx builds
# them: `cargo build --release` with RUSTFLAGS="-C target-cpu=x86-64-v3", the CPU level Calx's
# release builds use. Each program's source is in its benchmark's own folder.
[package]
name = "suite"
version = "0.1.0"
edition = "2021"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
flate2 = "1"
zstd = "0.13"
xz2 = "0.1"
sha2 = "0.10"
crc32fast = "1"
png = "0.17"
rayon = "1"

[[bin]]
name = "nbody"
path = "../nbody/nbody.rs"

[[bin]]
name = "spectralnorm"
path = "../spectralnorm/spectralnorm.rs"

[[bin]]
name = "fannkuch"
path = "../fannkuch/fannkuch.rs"

[[bin]]
name = "binarytrees"
path = "../binarytrees/binarytrees.rs"

[[bin]]
name = "mandelbrot"
path = "../mandelbrot/mandelbrot.rs"

[[bin]]
name = "fasta"
path = "../fasta/fasta.rs"

[[bin]]
name = "knucleotide"
path = "../knucleotide/knucleotide.rs"

[[bin]]
name = "revcomp"
path = "../revcomp/revcomp.rs"

[[bin]]
name = "regexredux"
path = "../regexredux/regexredux.rs"

[[bin]]
name = "pidigits"
path = "../pidigits/pidigits.rs"

[[bin]]
name = "json"
path = "../json/json.rs"

[[bin]]
name = "csv"
path = "../csv/csv.rs"

[[bin]]
name = "logs"
path = "../logs/logs.rs"

[[bin]]
name = "wordcount"
path = "../wordcount/wordcount.rs"

[[bin]]
name = "sort"
path = "../sort/sort.rs"

[[bin]]
name = "hashmap"
path = "../hashmap/hashmap.rs"

[[bin]]
name = "objects"
path = "../objects/objects.rs"

[[bin]]
name = "text"
path = "../text/text.rs"

[[bin]]
name = "files"
path = "../files/files.rs"

[[bin]]
name = "compress"
path = "../compress/compress.rs"

[[bin]]
name = "hash"
path = "../hash/hash.rs"

[[bin]]
name = "png"
path = "../png/png.rs"

[[bin]]
name = "parmandel"
path = "../parmandel/parmandel.rs"

[[bin]]
